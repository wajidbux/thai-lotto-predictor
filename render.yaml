services:
  - type: web
    name: thai-lotto-predictor
    env: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: PORT
        value: 3000
